<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" role="img" aria-labelledby="title desc">
  <title id="title">revive</title>
  <desc id="desc">Blue anime-inspired wordmark for a web developer profile.</desc>
  <defs>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#5EE7FF" stop-opacity="0"/>
      <stop offset=".2" stop-color="#5EE7FF"/>
      <stop offset=".8" stop-color="#8A7DFF"/>
      <stop offset="1" stop-color="#8A7DFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-100%" width="200%" height="300%">
