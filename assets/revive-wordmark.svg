  <text x="600" y="110" text-anchor="middle" fill="#93CFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="4">WEB EXPERIENCES / BLUE HOUR EDITION</text>
