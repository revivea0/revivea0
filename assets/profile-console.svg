<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">revive — web developer profile</title>
  <desc id="desc">Blue anime-inspired interface showing Revive's focus, toolset and status.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B20"/>
      <stop offset="0.5" stop-color="#101B52"/>
      <stop offset="1" stop-color="#06152E"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#15275F" stop-opacity=".9"/>
      <stop offset="1" stop-color="#091334" stop-opacity=".74"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#6DE4FF" stop-opacity="0"/>
      <stop offset=".48" stop-color="#6DE4FF"/>
      <stop offset="1" stop-color="#8C7BFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moon">
      <stop stop-color="#F0FBFF"/>
      <stop offset=".42" stop-color="#9CDBFF"/>
      <stop offset="1" stop-color="#3E6DFF" stop-opacity=".15"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#86B9FF" stroke-opacity=".08"/>
    </pattern>
  </defs>

  <rect width="1200" height="410" rx="24" fill="url(#sky)"/>
  <rect width="1200" height="410" rx="24" fill="url(#grid)"/>
  <circle cx="1040" cy="-30" r="260" fill="#416DFF" opacity=".16"/>
  <circle cx="95" cy="375" r="210" fill="#8B7CFF" opacity=".13"/>
  <g fill="#BDEFFF" opacity=".85">
    <circle cx="90" cy="75" r="2"/><circle cx="174" cy="45" r="1.5"/><circle cx="343" cy="70" r="1"/>
    <circle cx="835" cy="61" r="1.5"/><circle cx="1012" cy="86" r="2"/><circle cx="1125" cy="145" r="1"/>
    <circle cx="1082" cy="336" r="1.5"/><circle cx="750" cy="356" r="1"/>
  </g>
  <path d="M0 325C205 260 310 385 496 323S815 245 1200 322V410H0Z" fill="#07142D" opacity=".7"/>
  <path d="M0 352C176 306 304 390 500 343S876 280 1200 350" fill="none" stroke="#75DFFF" stroke-opacity=".35" stroke-width="1.5"/>

  <g transform="translate(48 45)">
    <rect width="262" height="268" rx="20" fill="#071530" fill-opacity=".72" stroke="#7DDFFF" stroke-opacity=".35"/>
    <circle cx="131" cy="111" r="77" fill="url(#moon)" filter="url(#glow)"/>
    <circle cx="131" cy="111" r="59" fill="#0B2463" fill-opacity=".68"/>
    <path d="M113 95c7-22 36-33 55-13 14 15 9 43-11 54-8 5-13 15-13 27h-49c4-16-4-33-14-42-10-10-9-29 4-38 8-5 19-5 28 12Z" fill="#9DE7FF" fill-opacity=".9"/>
    <path d="M103 161c15-14 40-16 57 0l16 37H87Z" fill="#4D6FFF" fill-opacity=".9"/>
    <path d="M69 213h124" stroke="#80E5FF" stroke-opacity=".7"/>
    <text x="131" y="237" text-anchor="middle" fill="#D9F7FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="3">夜 / 01</text>
  </g>

  <g transform="translate(357 77)">
    <text fill="#8BEAFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="4">DIGITAL DEVELOPER // ONLINE</text>
    <text y="76" fill="#F4FBFF" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700" letter-spacing="-3">revive</text>
    <path d="M0 101H740" stroke="url(#line)" stroke-width="2" filter="url(#glow)"/>
    <text y="137" fill="#B9C8EE" font-family="Arial, Helvetica, sans-serif" font-size="18">building websites that feel fast, clear and alive</text>

    <g transform="translate(0 171)">
      <rect width="228" height="83" rx="14" fill="url(#card)" stroke="#8BBAFF" stroke-opacity=".26"/>
      <text x="18" y="27" fill="#82DFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2">FOCUS</text>
      <text x="18" y="55" fill="#F0F6FF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">UX · PERFORMANCE · SEO</text>
    </g>
    <g transform="translate(247 171)">
      <rect width="270" height="83" rx="14" fill="url(#card)" stroke="#8BBAFF" stroke-opacity=".26"/>
      <text x="18" y="27" fill="#82DFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2">TOOLSET</text>
      <text x="18" y="55" fill="#F0F6FF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">NEXT · REACT · ASTRO · TS</text>
    </g>
    <g transform="translate(536 171)">
      <rect width="204" height="83" rx="14" fill="url(#card)" stroke="#8BBAFF" stroke-opacity=".26"/>
      <text x="18" y="27" fill="#82DFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2">STATUS</text>
      <circle cx="24" cy="55" r="5" fill="#8CFFCE" filter="url(#glow)"/>
      <text x="39" y="60" fill="#F0F6FF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">BUILDING</text>
    </g>
  </g>
</svg>
